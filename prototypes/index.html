<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Q&A — UI prototypes (throwaway)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="chrome">
    <div class="chrome-brand">Live Q&A prototypes</div>
    <nav class="switcher" aria-label="Variant switcher">
      <button type="button" data-variant="a" class="is-active">A · Signal</button>
      <button type="button" data-variant="b">B · Forum</button>
      <button type="button" data-variant="c">C · Stage</button>
    </nav>
    <p class="chrome-note">Throwaway. Press 1 / 2 / 3. Host vs participant below.</p>
  </header>

  <main id="stage" data-variant="a">
    <!-- filled by script -->
  </main>

  <script src="./app.js"></script>
</body>
</html>
